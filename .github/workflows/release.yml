name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    name: Publish (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    steps:
      - uses: actions/checkout@v7

      # Tauri needs the webkit2gtk toolchain to compile and bundle on Linux;
      # the Windows and macOS runners already ship their platform toolchains
      # (MSVC + WebView2 / Xcode CLT).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both targets are only used on macOS runners, so it's in an `if`
          # to slightly speed up the Windows and Linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The Windows MSI bundler downloads the WiX3 toolset on first use with
      # no retry, which flakes on GitHub's runners (io: Peer disconnected).
      # Pre-fetch it (with curl retries) into the bundler's cache directory so
      # the bundler finds it already present and skips its own download.
      - name: Pre-fetch WiX3 toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          if (!(Test-Path (Join-Path $wixDir 'light.exe'))) {
            $zip = Join-Path $env:TEMP 'wix314-binaries.zip'
            curl.exe -L --fail --connect-timeout 30 --retry 5 --retry-delay 5 --retry-all-errors -o $zip `
              https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
            $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
            if ((Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower() -ne $expected) {
              throw 'WiX3 download failed SHA256 verification'
            }
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            Expand-Archive -Path $zip -DestinationPath $wixDir -Force
            Remove-Item $zip
          }
          "WixTools314 files: $((Get-ChildItem $wixDir).Count)"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater artifacts are minisign-signed with this key pair.
          # Set the secrets in the repo settings (Actions → Secrets and
          # variables): TAURI_SIGNING_PRIVATE_KEY = contents of the .key
          # file generated with `tauri signer generate`; keep the matching
          # public key in sync with tauri.conf.json → plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without a password; `|| ''` guarantees the
          # variable exists (an unset variable makes the signer prompt for a
          # password and fail on CI).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickSpot v__VERSION__'
          releaseBody: |
            ### Highlights

            - **Localization** — QuickSpot now speaks your language. English and Spanish are bundled; the app follows your system language by default and lets you override it in Settings. Adding a new language is a one-file PR.
            - **Check for updates** — a dedicated button in Settings checks for a new version at any time, on top of the automatic check on every open.
            - **Show action icons** — new Settings toggle to hide the kind icons on the chips and give the labels more room.
            - **Reliable launch at login on macOS** — autostart now uses Login Items (listed in System Settings → Login Items), replacing the old LaunchAgent plist that macOS sometimes ignored.
            - **Faster first open** — the overlay window is pre-warmed right after launch, so the very first hotkey press opens instantly.
            - **Improved group picker** — selecting a group for an action now uses a floating popover, with the color palette and custom-hex editor refreshed.
          # Published (not draft): the in-app updater polls the
          # `releases/latest` endpoint, which only sees published releases.
          releaseDraft: false
          generateReleaseNotes: true
          prerelease: false
          # Point the Windows updater at the per-user NSIS installer instead
          # of the MSI (quieter, no elevation needed).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
