<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QuickSpot</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="overlay" aria-label="Quickspot quick actions">
      <div id="disc" aria-hidden="true"></div>
      <div id="chips" role="group" aria-label="Actions"></div>
      <button id="hub" aria-label="Settings">
        <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2" />
          <g transform="translate(12 12)">
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(45)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(90)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(135)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(180)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(225)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(270)" />
            <rect x="-1.5" y="-7.2" width="3" height="14.4" rx="1.4" fill="currentColor" stroke="none" transform="rotate(315)" />
            <circle class="core" cx="0" cy="0" r="2.6" fill="#171717" stroke="none" />
          </g>
        </svg>
      </button>
      <button id="add" aria-label="Add actions">
        <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <div id="query-wrap">
        <span id="query-mirror" class="dim" aria-hidden="true"></span>
        <span id="caret" aria-hidden="true"></span>
        <input id="query" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search actions" />
      </div>
      <div id="empty-state" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="run-error" role="alert" aria-live="assertive" aria-hidden="true"></div>
      <button id="minimize" aria-label="Minimize to tray">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
      <button id="update" aria-label="Update">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v11" />
          <polyline points="7 11 12 16 17 11" />
          <path d="M5 20h14" />
        </svg>
        <span class="update-label">Update</span>
      </button>
      <div id="grip" aria-label="Drag to move the window">
        <svg viewBox="0 0 24 8" fill="currentColor">
          <circle cx="4" cy="4" r="1.9" />
          <circle cx="12" cy="4" r="1.9" />
          <circle cx="20" cy="4" r="1.9" />
        </svg>
      </div>
      <form id="settings" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true">
        <div id="settings-header">
          <span id="settings-title">Settings</span>
          <button id="settings-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <section class="settings-section" id="settings-general" aria-labelledby="settings-general-heading">
          <h2 class="settings-section-title" id="settings-general-heading">General</h2>
          <div class="settings-group">
            <div class="settings-list-row settings-list-row-col">
              <label class="settings-row-label" for="settings-lang" id="settings-language-label">Language</label>
              <select id="settings-lang" aria-label="Language"></select>
              <p class="settings-translators" id="settings-translators"></p>
            </div>
            <label class="settings-list-row">
              <span class="settings-row-label" id="settings-dock-label">Magnify on hover</span>
              <span class="switch">
                <input id="settings-magnify" type="checkbox" />
                <span class="switch-track"></span>
              </span>
            </label>
            <label class="settings-list-row">
              <span class="settings-row-label" id="settings-icons-label">Show action icons</span>
              <span class="switch">
                <input id="settings-icons" type="checkbox" />
                <span class="switch-track"></span>
              </span>
            </label>
            <label class="settings-list-row">
              <span class="settings-row-label" id="settings-autostart-label">Launch at login</span>
              <span class="switch">
                <input id="settings-autostart" type="checkbox" />
                <span class="switch-track"></span>
              </span>
            </label>
            <div class="settings-list-row">
              <span class="settings-row-label" id="settings-update-label">Check for updates</span>
              <button id="settings-update-check" type="button">Check now</button>
            </div>
          </div>
        </section>
        <p class="settings-version" id="settings-version"></p>
        <div id="settings-footer">
          <span id="settings-error" role="alert" aria-live="assertive"></span>
          <button id="settings-save" type="submit">Save</button>
        </div>
      </form>
      <form id="actions" role="dialog" aria-modal="true" aria-label="Actions" aria-hidden="true">
        <div id="actions-header">
          <span id="actions-title">Actions</span>
          <button id="actions-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <p id="actions-description" class="sr-only"></p>
        <div id="actions-tabs" role="tablist" aria-orientation="horizontal" aria-label="Action editor sections">
          <button id="actions-tab" type="button" role="tab" aria-controls="actions-panel" aria-selected="true" tabindex="0">Actions</button>
          <button id="groups-tab" type="button" role="tab" aria-controls="groups-panel" aria-selected="false" tabindex="-1">Groups</button>
        </div>
        <div id="actions-rows"></div>
        <div id="actions-footer">
          <span id="actions-error" role="alert" aria-live="assertive"></span>
          <button id="actions-save" type="submit">Save</button>
        </div>
        <span id="actions-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
